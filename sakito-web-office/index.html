<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakito Web オフィス 1F ラウンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.50.0/dist/tabler-icons.min.css">
<style>
/* layout: full-viewport app. Header strip, then a map area (pixel canvas fitted to the space) with a video rail on the right while seated, a floating control bar at the bottom, and drawers/overlays on top. One LiveKit room per floor; each person's "table" attribute decides who hears whom. */
:root{
  --bg:#e8eef2; --surface:#ffffff; --ink:#1d2433; --muted:#5b6476; --line:#cfd6df;
  --accent:#2f6fd6; --accent-soft:#e3edfc; --pix:#1d2433;
  --good:#2b9a5a; --good-soft:#dff1e6; --bad:#c2372f; --bad-soft:#fae3e1;
  --font-pixel:"DotGothic16","Hiragino Kaku Gothic ProN",monospace;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:3px solid var(--pix)}
.top .ttl{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand{font-family:var(--font-pixel);font-size:13px;color:var(--accent);letter-spacing:.08em}
.top h1{font-family:var(--font-pixel);font-weight:400;font-size:20px;margin:0;line-height:1.2;white-space:nowrap}
.top .meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);white-space:nowrap}
.top .meta b{font-family:var(--font-pixel);font-weight:400;color:var(--ink);font-size:15px}
.top .meta a{font-size:12.5px;text-decoration:none;border:1.5px solid var(--pix);padding:1px 10px;color:var(--ink)}
.main{flex:1;min-height:0;display:flex;position:relative}
.stage-area{flex:1;min-width:0;overflow:auto;display:flex;padding:10px 10px 92px;background:#cfe6f6}
.stage{position:relative;margin:auto;flex:none;border:3px solid var(--pix);box-shadow:4px 4px 0 var(--pix)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
.ov > *{pointer-events:auto}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-pixel);font-size:13px;color:#fff;background:var(--accent);padding:1px 10px;white-space:nowrap;pointer-events:none;border:2px solid var(--pix)}
.plate{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-pixel);font-size:11px;background:rgba(255,255,255,.9);color:var(--ink);border:1px solid rgba(29,36,51,.35);padding:0 6px;white-space:nowrap;line-height:1.45;pointer-events:none}
.plate .n{color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.plate.mine{background:var(--accent);color:#fff;border-color:var(--pix)}
.plate.mine .n{color:#dce8ff}
.plate.full .n{color:var(--bad)}
.hot{position:absolute;background:transparent;border:2px solid transparent;padding:0;display:block;border-radius:40%}
.hot:hover,.hot:focus-visible{border-color:var(--accent);background:rgba(47,111,214,.08)}
.hot.sq{border-radius:0}
.hot .cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-pixel);font-size:12px;background:var(--pix);color:#fff;padding:1px 8px;white-space:nowrap;display:none}
.hot:hover .cap,.hot:focus-visible .cap{display:block}
/* people on the map: pixel sprite (canvas) + round face above the head */
.char{position:absolute;background:transparent;border:none;padding:0;z-index:2}
.char .face{position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);width:130%;min-width:26px;aspect-ratio:1;border-radius:50%;background:#2b3042;border:3px solid #fff;overflow:visible;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.char .face .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#2b3042}
.char .face .in canvas{position:static;width:58%;height:auto;image-rendering:pixelated;margin-top:30%}
.char .face video{width:100%;height:100%;object-fit:cover}
.char.incall .face{border-color:var(--good)}
.char.incall.muted .face{border-color:#9aa3b5}
.char.speaking .face{border-color:var(--good);box-shadow:0 0 0 3px rgba(43,154,90,.45)}
.char .mute{position:absolute;right:-5px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;border:1.5px solid #fff}
.char.incall.muted .mute{display:flex}
.char .nm{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-family:var(--font-pixel);font-size:10.5px;background:rgba(29,36,51,.85);color:#fff;padding:0 5px;white-space:nowrap;pointer-events:none;line-height:1.45;display:none}
.char:hover .nm,.char:focus-visible .nm,.char.me .nm{display:block}
.char.me .nm{background:var(--accent)}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:var(--font-pixel);font-size:12px;background:#fff;color:var(--ink);border:2px solid var(--pix);padding:1px 8px;white-space:nowrap;pointer-events:none;box-shadow:2px 2px 0 rgba(29,36,51,.35)}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pix)}
.bubble:empty{display:none}
/* video rail */
.rail{flex:none;width:230px;background:#20242f;border-left:3px solid var(--pix);display:flex;flex-direction:column;gap:8px;padding:10px 10px 92px;overflow-y:auto}
.rail h2{font-family:var(--font-pixel);font-weight:400;font-size:14px;color:#fff;margin:0;display:flex;justify-content:space-between}
.rail h2 span{color:#aab3be;font-size:12px}
.vcard{position:relative;aspect-ratio:4/3;background:#2b3042;border:2px solid #3a4152;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.vcard video{width:100%;height:100%;object-fit:cover}
.vcard video.contain{object-fit:contain;background:#000}
.vcard canvas{width:30%;height:auto;image-rendering:pixelated}
.vcard .tn{position:absolute;left:6px;bottom:5px;font-size:12px;background:rgba(0,0,0,.6);color:#fff;padding:0 7px;border-radius:4px;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .mi{position:absolute;right:6px;bottom:5px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(0,0,0,.6);color:#fff}
.vcard .mi.off{background:var(--bad)}
.vcard.speaking{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.vcard.share{border-color:#ffb020;cursor:pointer}
.vcard.share .tn{background:#ffb020;color:var(--ink)}
video.mirror{transform:scaleX(-1)}
/* control bar */
.bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;background:var(--surface);border:2px solid var(--pix);box-shadow:4px 4px 0 var(--pix);border-radius:14px;padding:6px 8px;z-index:20}
.bar .sep{width:1px;background:var(--line);margin:4px 4px}
.cb{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:5px 6px 3px;border:none;background:transparent;border-radius:10px;font-size:11.5px;color:var(--ink);white-space:nowrap}
.cb i{font-size:22px;line-height:1;width:38px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.cb:hover{background:var(--bg)}
.cb.off i{background:var(--bad-soft);color:var(--bad)}
.cb.on i{background:var(--good-soft);color:var(--good)}
.cb.active i{background:var(--accent);color:#fff}
.cb.exit{color:var(--bad)}
.cb.exit i{background:var(--bad);color:#fff}
.cb .badge{position:absolute;top:0;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.cb .badge:empty{display:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--pix);color:#fff;font-size:13.5px;padding:6px 14px;border-radius:8px;z-index:25;max-width:min(90%,560px);text-align:center;pointer-events:none;transition:opacity .3s}
.toast.hide{opacity:0}
/* drawers */
.drawer{position:absolute;top:10px;right:10px;bottom:92px;width:min(340px,calc(100% - 20px));background:var(--surface);border:2px solid var(--pix);box-shadow:4px 4px 0 var(--pix);border-radius:10px;display:flex;flex-direction:column;z-index:22}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:2px solid var(--pix)}
.d-head h2{font-family:var(--font-pixel);font-weight:400;font-size:16px;margin:0}
.d-head h2 span{font-size:12.5px;color:var(--muted);margin-left:6px}
.xbtn{border:none;background:transparent;font-size:20px;line-height:1;padding:2px 4px}
.d-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chat li{font-size:14px;overflow-wrap:anywhere}
.chat li b{font-weight:700;margin-right:6px}
.chat li time{font-size:11.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.chat li.sys{color:var(--muted);font-size:12.5px}
.d-foot{border-top:2px solid var(--pix);padding:10px 12px;display:flex;gap:8px}
.d-foot input{flex:1;min-width:0;padding:7px 10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;border-radius:6px}
.btn{border:2px solid var(--pix);padding:6px 14px;background:var(--accent);color:#fff;font-weight:500;font-size:14px;white-space:nowrap;border-radius:6px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roster li{border:2px solid var(--pix);background:var(--bg);padding:7px 10px;border-radius:6px;display:flex;flex-direction:column;gap:3px}
.roster li.mine{background:var(--accent-soft)}
.roster .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.roster .rh b{font-family:var(--font-pixel);font-weight:400;font-size:14px}
.roster .who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mini{font-size:12px;padding:1px 10px;border:1.5px solid var(--pix);background:var(--surface);border-radius:4px}
.note{font-size:12.5px;color:var(--muted);margin:0}
/* big view */
.big{position:absolute;inset:0;bottom:0;background:#171a22;z-index:15;display:flex;flex-direction:column;padding:12px 12px 92px;gap:10px}
.big-head{display:flex;justify-content:space-between;align-items:center;color:#fff}
.big-head h2{font-family:var(--font-pixel);font-weight:400;font-size:16px;margin:0}
.big-body{flex:1;min-height:0;display:grid;gap:10px}
.big-body.grid{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));align-content:center}
.big-body.share{grid-template-columns:minmax(0,1fr) 220px}
.big-body.share .side{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.big-body .vcard{aspect-ratio:auto;min-height:0}
.big-body.grid .vcard{aspect-ratio:16/10}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.md-box{background:var(--surface);border:3px solid var(--pix);box-shadow:6px 6px 0 var(--pix);border-radius:12px;width:min(820px,100%);max-height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.md-box.sm{width:min(420px,100%)}
.md-box h3{font-family:var(--font-pixel);font-weight:400;font-size:21px;margin:0}
.prejoin{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.pv{position:relative;aspect-ratio:4/3;background:#20242f;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#c9d2e0;font-size:13.5px;text-align:center;padding:0}
.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv .pvmsg{padding:16px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .08s}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lab{font-size:12.5px;color:var(--muted)}
.field input,.field select{padding:7px 10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;border-radius:6px;min-width:0}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:6px;border:2px solid var(--pix);border-radius:8px;padding:4px 12px;background:var(--surface);font-size:13.5px}
.tg i{font-size:18px}
.tg[aria-pressed="false"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border:2px solid var(--pix);padding:0;border-radius:6px}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.styles button{border:1.5px solid var(--pix);background:var(--surface);padding:2px 12px;font-size:13px;border-radius:4px}
.styles button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lookrow{display:flex;align-items:center;gap:14px}
.lookrow canvas{width:36px;height:57px;image-rendering:pixelated;border:2px solid var(--pix);background:#f4f8fc;border-radius:6px;flex:none}
.err{color:var(--bad);font-size:13px;margin:0;min-height:1em}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width:820px){
  .prejoin{grid-template-columns:1fr}
  .rail{width:132px;padding:8px 8px 92px}
  .rail h2 span{display:none}
  .top h1{font-size:16px}
  .top .meta .clk{display:none}
}
@media (max-width:720px){
  .cb{min-width:44px;font-size:0}
  .cb i{width:36px;height:34px}
  .cb .badge{font-size:11px;right:0}
  .bar{padding:4px;gap:0;bottom:10px;max-width:calc(100% - 12px)}
  .bar .sep{margin:4px 1px}
  .plate,.sign,.hot .cap{display:none!important}
  .bubble{font-size:10px;padding:0 4px}
  .big-body.share{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .big-body.share .side{flex-direction:row;overflow-x:auto}
  .big-body.share .side .vcard{width:120px}
  .brand{display:none}
  .main{flex-direction:column}
  .rail{order:-1;width:auto;height:112px;flex-direction:row;padding:8px;border-left:none;border-bottom:3px solid var(--pix);overflow-x:auto;overflow-y:hidden}
  .rail h2,.rail .note{display:none}
  .rail .vcard{height:100%;aspect-ratio:4/3}
  .stage-area{padding-bottom:84px}
  .drawer{bottom:84px}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="ttl"><span class="brand">SAKITO WEB</span><h1>1F ラウンジ</h1></div>
    <div class="meta">
      <span>いる人 <b id="count">0</b></span>
      <span class="clk" id="clock"></span>
      <a href="https://claude.ai/artifact/EP51sztZeDAAts6cfgXpSR" id="to-2f" hidden>2F(社内専用)</a>
    </div>
  </header>
  <div class="main" id="main">
    <div class="stage-area" id="stage-area">
      <div class="stage" id="stage">
        <canvas id="cv" width="448" height="240" role="img" aria-label="Sakito Webオフィス1階のラウンジ。丸テーブルが6つとソファ席、個室ブース、3人用の喫煙所、エレベーターホールがあり、テーブルをクリックするとそこに座れる"></canvas>
        <div class="ov" id="ov"></div>
      </div>
    </div>
    <aside class="rail" id="rail" hidden aria-label="同じテーブルの人の映像"></aside>

    <section class="big" id="big" hidden aria-label="大きく表示">
      <div class="big-head"><h2 id="big-title">会話中</h2><button class="btn ghost" data-action="big">地図に戻る</button></div>
      <div class="big-body grid" id="big-body"></div>
    </section>

    <section class="drawer" id="drawer-chat" hidden aria-labelledby="h-chat">
      <div class="d-head"><h2 id="h-chat">チャット<span id="chat-where"></span></h2><button class="xbtn" data-action="chat" aria-label="チャットを閉じる"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="d-body"><ul class="chat" id="chat" aria-live="polite"></ul></div>
      <form class="d-foot" id="chat-form"><input id="chat-input" aria-label="テーブルにメッセージを送る" placeholder="同じテーブルの人に送る" autocomplete="off"><button class="btn" type="submit" aria-label="送信"><i class="ti ti-send" aria-hidden="true"></i></button></form>
    </section>

    <section class="drawer" id="drawer-people" hidden aria-labelledby="h-people">
      <div class="d-head"><h2 id="h-people">参加者</h2><button class="xbtn" data-action="people" aria-label="参加者を閉じる"><i class="ti ti-x" aria-hidden="true"></i></button></div>
      <div class="d-body"><ul class="roster" id="roster"></ul></div>
    </section>

    <div class="toast hide" id="toast" role="status"></div>

    <nav class="bar" id="bar" aria-label="操作">
      <button class="cb" id="cb-cam" data-action="cam"><i class="ti ti-video" aria-hidden="true"></i><span>カメラ</span></button>
      <button class="cb" id="cb-mic" data-action="mic"><i class="ti ti-microphone" aria-hidden="true"></i><span>マイク</span></button>
      <button class="cb" id="cb-share" data-action="share"><i class="ti ti-screen-share" aria-hidden="true"></i><span>画面共有</span></button>
      <span class="sep"></span>
      <button class="cb" id="cb-chat" data-action="chat"><i class="ti ti-message" aria-hidden="true"></i><span>チャット</span><b class="badge" id="chat-badge"></b></button>
      <button class="cb" id="cb-people" data-action="people"><i class="ti ti-users" aria-hidden="true"></i><span>参加者</span></button>
      <button class="cb" id="cb-big" data-action="big"><i class="ti ti-layout-grid" aria-hidden="true"></i><span>大きく表示</span></button>
      <button class="cb" id="cb-leave" data-action="leave"><i class="ti ti-armchair" aria-hidden="true"></i><span>席を立つ</span></button>
      <span class="sep"></span>
      <button class="cb exit" data-action="exit"><i class="ti ti-door-exit" aria-hidden="true"></i><span>退出</span></button>
    </nav>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
<div id="audio-sink" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
<script>
(function () {
  "use strict";
  /* staff-only entrance to 2F: open the page once as .../#staff on your own device (#guest turns it off) */
  var IS_STAFF = false;
  try {
    if (location.hash === "#staff") localStorage.setItem("sw-staff", "1");
    if (location.hash === "#guest") localStorage.removeItem("sw-staff");
    IS_STAFF = localStorage.getItem("sw-staff") === "1";
    if (location.hash === "#staff" || location.hash === "#guest") history.replaceState(null, "", location.pathname + location.search);
  } catch (e) {}
  if (IS_STAFF) document.getElementById("to-2f").hidden = false;
  window.addEventListener("hashchange", function () { if (location.hash === "#staff" || location.hash === "#guest") { try { if (location.hash === "#staff") localStorage.setItem("sw-staff", "1"); else localStorage.removeItem("sw-staff"); } catch (e) {} location.replace(location.pathname + location.search); } });
  var W = 448, H = 240, LANE = 118, FLOOR = 1;
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  function P(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function f(v) { return Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt))); }

      });
    });
    setTimeout(function () { var i = document.getElementById(draft.name ? "pf-pass" : "pf-name"); if (i) i.focus(); }, 30);
  }
  function renderToggles() {
    var c = document.getElementById("tg-cam"), m = document.getElementById("tg-mic"); if (!c) return;
    c.setAttribute("aria-pressed", String(state.cam)); c.innerHTML = '<i class="ti ' + (state.cam ? "ti-video" : "ti-video-off") + '" aria-hidden="true"></i>' + (state.cam ? "カメラ オンで入る" : "カメラ オフで入る");
    m.setAttribute("aria-pressed", String(state.mic)); m.innerHTML = '<i class="ti ' + (state.mic ? "ti-microphone" : "ti-microphone-off") + '" aria-hidden="true"></i>' + (state.mic ? "マイク オンで入る" : "ミュートで入る");
  }
  function paintPreview() {
    var c = document.getElementById("pf-face"); if (!c) return;
    var g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 14, 22);
    drawSprite(g, 7, 22, normLook({ color: draft.color, style: draft.style }), "happy", { noShadow: true });
  }
  function openExitConfirm() {
    openModal('<h3>退出しますか?</h3><p class="note">1階のラウンジから出て、通話を終了します。</p><div class="row-end"><button class="btn ghost" data-action="modal-close">キャンセル</button><button class="btn danger" data-action="exit-yes"><i class="ti ti-door-exit" aria-hidden="true"></i> 退出する</button></div>', true);
  }
  function openGone(title, text) {
    openModal("<h3>" + esc(title) + '</h3><p class="note">' + esc(text) + '</p><div class="row-end"><button class="btn" data-action="reenter">もう一度入る</button></div>', true);
  }

  /* ----- events ----- */
  document.addEventListener("click", function (e) {
    if (room && !room.canPlaybackAudio) room.startAudio().catch(function () {});
    var b = e.target.closest("[data-action]"); if (!b) return;
    var a = b.getAttribute("data-action");
    if (a === "sit") {
      if (!me) { openEntry(); return; }
      var tid = b.getAttribute("data-table"), t = TBY[tid];
      if (me.want === tid) { toast("もう" + t.name + "に座っています"); return; }
      if (occupants(tid).length >= t.seats.length) { toast(t.name + "は満席です"); return; }
      setTable(tid); toast(t.name + "へ移動しています"); if (ui.drawer === "people") { ui.drawer = ""; renderControls(); }
    } else if (a === "person") {
      var p = people[b.getAttribute("data-id")]; if (!p || p.isMe || !me || !p.table || me.table === p.table) return;
      if (occupants(p.table).length >= TBY[p.table].seats.length) { toast(TBY[p.table].name + "は満席です"); return; }
      setTable(p.table); toast(p.name + "さんのいる" + TBY[p.table].name + "へ移動しています");
    } else if (a === "leave") { if (me) { setTable(""); toast("席を立ちました。会話からは外れています"); } }
    else if (a === "mic") { state.mic = !state.mic; syncMedia(); renderControls(); if (!me || !me.table) toast(state.mic ? "座るとマイクがオンになります" : "座ってもマイクはオフのままです"); }
    else if (a === "cam") { state.cam = !state.cam; syncMedia(); renderControls(); if (!me || !me.table) toast(state.cam ? "座るとカメラがオンになります" : "座ってもカメラはオフのままです"); }
    else if (a === "share") { if (!me) return; toggleShare(); }
    else if (a === "chat" || a === "people") { ui.drawer = ui.drawer === a ? "" : a; if (ui.drawer === "chat") { ui.unread = 0; renderChat(); setTimeout(function () { var i = document.getElementById("chat-input"); if (i && !i.disabled) i.focus(); }, 20); } renderControls(); }
    else if (a === "big") {
      if (!ui.big && (!me || !me.table)) { toast("テーブルに座ると、相手の映像を大きく表示できます"); return; }
      ui.big = !ui.big; renderRail(); renderBig(); renderControls();
    }
    else if (a === "exit") { if (!me) { openEntry(); return; } openExitConfirm(); }
    else if (a === "exit-yes") {
      leaving = true;
      if (room) room.disconnect();
      resetRoom(); closeModal();
      openGone("退出しました", "おつかれさまでした。もう一度入るときは下のボタンからどうぞ。");
    }
    else if (a === "reenter") { closeModal(); openEntry(); }
    else if (a === "lift-locked") toast("このエレベーターは関係者専用です");
    else if (a === "modal-close") closeModal();
    else if (a === "pv-start") startPreview();
    else if (a === "tg-cam") { state.cam = !state.cam; renderToggles(); }
    else if (a === "tg-mic") { state.mic = !state.mic; renderToggles(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!modal.hidden && me) { closeModal(); return; }
      if (ui.drawer) { ui.drawer = ""; renderControls(); return; }
      if (ui.big) { ui.big = false; renderRail(); renderBig(); renderControls(); }
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".vcard.share")) { e.preventDefault(); e.target.click(); }
  });
  document.getElementById("chat-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var i = document.getElementById("chat-input"), v = i.value.trim().slice(0, 500);
    if (!v || !me || !me.table || !room) return;
    post(me.table, me, v); say(me, v.length > 14 ? v.slice(0, 14) + "…" : v); i.value = "";
    var dest = occupants(me.table).filter(function (p) { return !p.isMe; }).map(function (p) { return p.id; });
    if (dest.length) lp().publishData(new TextEncoder().encode(JSON.stringify({ t: me.table, text: v })), { reliable: true, topic: "chat", destinationIdentities: dest }).catch(function () { toast("メッセージを送れませんでした"); });
  });

  function tickClock() { var d = new Date(); document.getElementById("clock").textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hhmm(d); }
  tickClock(); setInterval(tickClock, 15000);
  setInterval(function () { renderPlates(); renderRoster(); document.getElementById("count").textContent = all().length; }, 3000);

  var savedMedia = load("sw2f-media"); if (savedMedia) { state.cam = savedMedia.cam !== false; state.mic = savedMedia.mic !== false; }
  fit(); renderUI();
  requestAnimationFrame(frame);
  if (!LK) openGone("読み込みに失敗しました", "通話の仕組みを読み込めませんでした。ネット接続を確認して、ページを再読み込みしてください。");
  else openEntry();
})();
</script>
</body>
</html>
