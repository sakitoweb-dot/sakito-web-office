<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakito Web オフィス 2F ラウンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: 2F lounge of the Sakito Web office (448x240 pixel canvas, HTML overlays, panels below). Remo-style: one LiveKit room for the floor; each person's "table" attribute decides who hears whom. */
:root{
  --bg:#e8eef2; --surface:#ffffff; --ink:#1d2433; --muted:#5b6476; --line:#cfd6df;
  --accent:#2f6fd6; --accent-soft:#e3edfc; --pix:#1d2433;
  --warn:#a35a00; --warn-soft:#fdf0d8; --good:#2b6f48; --good-soft:#dff1e6; --bad:#a3312b; --bad-soft:#fae3e1;
  --font-pixel:"DotGothic16","Hiragino Kaku Gothic ProN",monospace;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-pixel);font-size:14px;color:var(--accent);margin:0;letter-spacing:.08em}
h1{font-family:var(--font-pixel);font-weight:400;font-size:30px;margin:0;line-height:1.2}
h1 small{font-size:16px;color:var(--muted);margin-left:10px}
.clock{font-family:var(--font-pixel);font-size:14px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface);border:2px solid var(--pix);font-size:13px;box-shadow:2px 2px 0 var(--pix)}
.chip b{font-family:var(--font-pixel);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.chip.busy{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{font-family:var(--font-pixel);font-size:14px;padding:6px 14px;border:2px solid var(--pix);background:var(--surface);box-shadow:3px 3px 0 var(--pix);text-decoration:none;display:inline-block}
.pbtn.primary{background:var(--accent);color:#fff}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pix)}

/* ---------- stage ---------- */
.stage-scroll{overflow-x:auto;border:3px solid var(--pix);box-shadow:5px 5px 0 var(--pix);background:#cfe6f6}
.stage{position:relative;width:100%;min-width:910px;aspect-ratio:448/240}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
.ov > *{pointer-events:auto}
.sign{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-pixel);font-size:13px;color:#fff;background:var(--accent);padding:1px 10px;white-space:nowrap;pointer-events:none;border:2px solid var(--pix)}
.plate{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-pixel);font-size:10.5px;background:rgba(255,255,255,.88);color:var(--ink);border:1px solid rgba(29,36,51,.35);padding:0 6px;white-space:nowrap;line-height:1.45;pointer-events:none}
.plate .n{color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.plate.mine{background:var(--accent);color:#fff;border-color:var(--pix)}
.plate.mine .n{color:#dce8ff}
.plate.full .n{color:var(--bad)}
.hot{position:absolute;background:transparent;border:2px solid transparent;padding:0;display:block}
.hot:hover,.hot:focus-visible{border-color:var(--accent);background:rgba(47,111,214,.08)}
.hot .cap{position:absolute;left:50%;top:100%;transform:translate(-50%,3px);font-family:var(--font-pixel);font-size:10.5px;background:var(--pix);color:#fff;padding:0 6px;white-space:nowrap;display:none}
.hot:hover .cap,.hot:focus-visible .cap{display:block}
.char{position:absolute;background:transparent;border:none;padding:0;z-index:2}
.char:hover{outline:2px dashed var(--accent);outline-offset:2px}
.char .nm{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-family:var(--font-pixel);font-size:9.5px;background:rgba(29,36,51,.82);color:#fff;padding:0 4px;white-space:nowrap;pointer-events:none;line-height:1.45}
.char .nm{display:none}
.char:hover .nm,.char:focus-visible .nm,.char.me .nm{display:block}
.char.me .nm{background:var(--accent)}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:var(--font-pixel);font-size:12px;background:#fff;color:var(--ink);border:2px solid var(--pix);padding:1px 8px;white-space:nowrap;pointer-events:none;box-shadow:2px 2px 0 rgba(29,36,51,.35);max-width:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pix)}
.bubble:empty{display:none}
.talk{position:absolute;top:-6px;right:-8px;width:8px;height:8px;background:#3caa66;border:2px solid var(--pix);display:none;pointer-events:none}
.char.speaking .talk{display:block;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- panels ---------- */
.panels{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:2px solid var(--pix);box-shadow:4px 4px 0 var(--pix);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-family:var(--font-pixel);font-weight:400;font-size:17px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h2 span{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:4/3;background:#2b3042;border:2px solid var(--pix);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile canvas{width:42%;height:auto;image-rendering:pixelated}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#2b3042}
.tile video.mirror{transform:scaleX(-1)}
.tile.speaking{outline:3px solid #3caa66;outline-offset:-3px}
.tile .tn{position:absolute;left:4px;bottom:4px;font-size:11.5px;background:rgba(0,0,0,.55);color:#fff;padding:0 6px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mic{position:absolute;right:4px;top:4px;font-size:10.5px;font-family:var(--font-pixel);background:rgba(0,0,0,.55);color:#fff;padding:0 5px}
.tile .mic.off{background:var(--bad);color:#fff}
.tile.empty{background:#e4e9ef;border-style:dashed;border-color:#aab3be}
.tile.empty span{font-size:12px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--pix);padding:6px 14px;background:var(--accent);color:#fff;font-weight:500;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[aria-pressed="false"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.ghost[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--muted);margin:0}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;min-height:120px;overflow-y:auto}
.chat li{font-size:13.5px;overflow-wrap:anywhere}
.chat li b{font-weight:700;margin-right:6px}
.chat li time{font-size:11.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.chat li.sys{color:var(--muted);font-size:12.5px}
.add{display:flex;gap:8px}
.add input,.field input{flex:1;min-width:0;padding:7px 10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roster li{border:2px solid var(--pix);background:var(--bg);padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.roster li.mine{background:var(--accent-soft)}
.roster .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.roster .rh b{font-family:var(--font-pixel);font-weight:400;font-size:14px}
.roster .who{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.mini{font-size:12px;padding:1px 10px;border:1.5px solid var(--pix);background:var(--surface)}
.empty-msg{font-size:13px;color:var(--muted);margin:0}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.md-box{background:var(--surface);border:3px solid var(--pix);box-shadow:6px 6px 0 var(--pix);width:min(460px,100%);max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.md-box h3{font-family:var(--font-pixel);font-weight:400;font-size:20px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lab{font-size:12.5px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border:2px solid var(--pix);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.styles button{border:1.5px solid var(--pix);background:var(--surface);padding:2px 12px;font-size:13px}
.styles button[aria-pressed="true"]{background:var(--accent);color:#fff}
.preview-face{display:flex;align-items:center;gap:12px}
.preview-face canvas{width:42px;height:66px;image-rendering:pixelated;border:2px solid var(--pix);background:#f4f8fc}

@media (max-width:980px){.panels{grid-template-columns:1fr 1fr}.panels .panel:first-child{grid-column:1 / -1}}
@media (max-width:720px){
  .wrap{padding:14px 10px 40px;gap:12px}
  .panels{grid-template-columns:1fr}
  .stage{min-width:0}
  .stage-scroll{box-shadow:3px 3px 0 var(--pix)}
  .plate,.sign,.hot .cap,.char .nm{display:none!important}
  .bubble{font-size:9.5px;padding:0 4px;bottom:calc(100% + 3px)}
  .pbtn{font-size:12.5px;padding:4px 9px;box-shadow:2px 2px 0 var(--pix)}
  .chip{font-size:11.5px;padding:3px 8px;box-shadow:1px 1px 0 var(--pix)}
  .toolbar{flex-direction:column;align-items:stretch}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{font-size:12px}
}
@media (max-width:600px){h1{font-size:24px}}
@media (prefers-reduced-motion: reduce){.char.speaking .talk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="brand">SAKITO WEB</p>
      <h1>バーチャルオフィス<small>2F ラウンジ</small></h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="actions">
      <a class="pbtn" href="https://claude.ai/artifact/EP51sztZeDAAts6cfgXpSR">1F(社内専用)へ</a>
      <button class="pbtn" data-action="exit">退室</button>
    </div>
  </div>

  <div class="stage-scroll">
    <div class="stage" id="stage">
      <canvas id="cv" width="448" height="240" role="img" aria-label="Sakito Webオフィス2階のラウンジ。丸テーブルが6つとソファ席、個室ブース、エレベーターホールがあり、テーブルをクリックするとそこに座れる"></canvas>
      <div class="ov" id="ov"></div>
    </div>
  </div>

  <div class="panels">
    <section class="panel" aria-labelledby="h-table">
      <h2 id="h-table"><b id="table-title" style="font-weight:400">テーブルに座っていません</b><span id="table-count"></span></h2>
      <div class="tiles" id="tiles"></div>
      <div class="controls">
        <button class="btn ghost" data-action="mic" id="mic-btn" aria-pressed="true">マイク オン</button>
        <button class="btn ghost" data-action="cam" id="cam-btn" aria-pressed="true">カメラ オン</button>
        <button class="btn ghost" data-action="leave" id="leave-btn">席を立つ</button>
        <button class="btn" data-action="audio" id="audio-btn" hidden>音声を有効にする</button>
      </div>
      <p class="note">同じテーブルに座っている人とだけ、声と映像がつながります。席を立つとカメラとマイクは自動で止まります。</p>
    </section>
    <section class="panel" aria-labelledby="h-chat">
      <h2 id="h-chat">テーブルチャット<span id="chat-where"></span></h2>
      <ul class="chat" id="chat" aria-live="polite"></ul>
      <form class="add" id="chat-form"><input id="chat-input" aria-label="テーブルにメッセージを送る" placeholder="同じテーブルの人に送る" autocomplete="off"><button class="btn" type="submit">送信</button></form>
    </section>
    <section class="panel" aria-labelledby="h-roster">
      <h2 id="h-roster">フロアの人</h2>
      <ul class="roster" id="roster"></ul>
    </section>
  </div>

  <p class="note" id="note">入室すると、エレベーターで2階に上がってきます。テーブルをクリックするとそこへ歩いて座り、同じテーブルの人とだけ会話できます。</p>
</div>

<div class="modal" id="modal" hidden></div>
<div id="audio-sink" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>

<script>

  "use strict";
  var W = 448, H = 240, LANE = 118, FLOOR = 2;
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  /* ----- tables ----- */
  var RUGS = ["#bfd0d8", "#d9c7e6", "#f0d6b0", "#c8e0c4", "#f2c9c4", "#cdd6ee"];

    { id: "t1", name: "打ち合わせA", cx: 62, cy: 68 },

  var SOFA = { id: "sofa", name: "ソファ席", cx: 333, cy: 70, rug: "#e4d3bf", box: [292, 36, 86, 64], plate: [333, 34],

      { x: 356, y: 216, kind: "stool", via: [[356, LANE], [356, 186], [342, 186], [342, 216], [356, 216]] }
    ] };
  TABLES.push(SOFA); TABLES.push(BOOTH);
  var TBY = {}; TABLES.forEach(function (t) { TBY[t.id] = t; });
  var ENTRY = { x: 416, y: 42, via: [[416, LANE], [416, 42]] };
  var STAND = { x: 318, y: 128, via: [[318, LANE], [318, 128]] };

  /* ----- background (floor, rugs, wall) ----- */
  var bg = document.createElement("canvas"); bg.width = W; bg.height = H;
  (function drawBackground() {
    var c = bg.getContext("2d");
    function B(col, x, y, w, h) { c.fillStyle = col; c.fillRect(x, y, w, h); }

    for (var y = 30; y < H; y += 6) {
      B((y / 6) % 2 ? "#d8b07c" : "#dcb784", 0, y, W, 6);
      B("#c99e69", 0, y + 5, W, 1);
      var x = Math.floor(r() * 40);
      while (x < W) { B("#c49763", x, y, 1, 5); x += 40 + Math.floor(r() * 50); }
      for (var k = 0; k < 6; k++) B("#d2a873", Math.floor(r() * W), y + 1 + Math.floor(r() * 3), 3 + Math.floor(r() * 6), 1);
    }
    // round rugs under each table
    TABLES.forEach(function (t) {
      if (t.id === "sofa" || t.id === "booth") return;
      var rx = 40, ry = 30, cx = t.cx, cy = t.cy + 6;
      for (var dy = -ry; dy <= ry; dy++) {
        var w = Math.round(rx * Math.sqrt(1 - (dy / ry) * (dy / ry)));
        B(t.rug, cx - w, cy + dy, 2 * w, 1);
        if (Math.abs(dy) < ry - 3) { var w2 = w - 3; if ((dy + 100) % 4 === 0) B(shade(t.rug, -0.06), cx - w2, cy + dy, 2 * w2, 1); }
      }

    // sofa corner rug
    B("#e4d3bf", 292, 40, 86, 62); B("#ecdecd", 294, 42, 82, 58);
    for (var sy = 46; sy < 98; sy += 6) B("#e0cdb6", 298, sy, 74, 1);
    // cafe tiles around counter
    for (var ty = 124; ty < 160; ty += 8) for (var tx = 290; tx < 336; tx += 8) B(((tx + ty) / 8) % 2 ? "#ece6da" : "#e2dbcc", tx, ty, 8, 8);
    // elevator hall (right wing, x 384-448)

    B("#5a6270", 400, 32, 32, 9); B("#6a7380", 402, 33, 28, 7);

    var m = document.getElementById("modal"); m.hidden = false;
    m.innerHTML = '<form class="md-box" id="pf" role="dialog" aria-labelledby="pf-h">' +
      '<h3 id="pf-h">2F ラウンジに入る</h3>' +
      '<p class="note">名前と合言葉を入れて入室します。席に座るとカメラとマイクの許可を聞かれるので「許可」を選んでください。</p>' +
      '<div class="field"><label for="pf-name">表示名</label><input id="pf-name" maxlength="12" required value="' + esc(draft.name) + '" placeholder="例: 山田" autocomplete="nickname"></div>' +
      '<div class="field"><label for="pf-pass">合言葉</label><input id="pf-pass" type="password" required autocomplete="current-password"></div>' +
      '<div class="field"><span class="lab">服の色</span><div class="swatches">' + COLORS.map(function (c) { return '<button type="button" class="sw" data-color="' + c + '" style="background:' + c + '" aria-label="色 ' + c + '" aria-pressed="' + (c === draft.color) + '"></button>'; }).join("") + "</div></div>" +
      '<div class="field"><span class="lab">髪型</span><div class="styles">' + Object.keys(HAIRS).map(function (k) { return '<button type="button" data-style="' + k + '" aria-pressed="' + (k === draft.style) + '">' + HAIRS[k] + "</button>"; }).join("") + "</div></div>" +
      '<div class="preview-face"><canvas id="pf-face" width="14" height="22"></canvas><span class="note">この見た目でフロアを歩きます</span></div>' +
      '<p class="note" id="pf-err" role="alert" style="color:var(--bad)"></p>' +
      '<div class="controls"><button class="btn" type="submit" id="pf-go">入室する</button></div></form>';
    paintPreview();
    var f = document.getElementById("pf");
    f.addEventListener("click", function (e) {
      var sw = e.target.closest("[data-color]"), st = e.target.closest("[data-style]");
      if (sw) { draft.color = sw.getAttribute("data-color"); f.querySelectorAll("[data-color]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === sw)); }); paintPreview(); }
      if (st) { draft.style = st.getAttribute("data-style"); f.querySelectorAll("[data-style]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === st)); }); paintPreview(); }
    });
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("pf-name").value.trim().slice(0, 12), pass = document.getElementById("pf-pass").value;
      if (!name || !pass) return;
      draft.name = name;
      var go = document.getElementById("pf-go"), err = document.getElementById("pf-err");
      go.disabled = true; go.textContent = "接続中…"; err.textContent = "";
      connect(draft, pass).then(function () { saveProfile(draft); closeModal(); }, function (x) {
        go.disabled = false; go.textContent = "入室する";
        err.textContent = (x && x.message) || "接続できませんでした。";
        if (room) { try { room.disconnect(); } catch (e2) {} room = null; }
      });
    });
    setTimeout(function () { var i = document.getElementById(draft.name ? "pf-pass" : "pf-name"); if (i) i.focus(); }, 30);
  }
  function paintPreview() {
    var c = document.getElementById("pf-face"); if (!c) return;
    var g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 14, 22);
    drawSprite(g, 7, 22, normLook({ color: draft.color, style: draft.style }), "happy", { noShadow: true });
  }
  function closeModal() { var m = document.getElementById("modal"); m.hidden = true; m.innerHTML = ""; }

  /* ----- events ----- */
  document.addEventListener("click", function (e) {
    if (room && !room.canPlaybackAudio) room.startAudio().catch(function () {});
    var b = e.target.closest("[data-action]"); if (!b) return;
    var a = b.getAttribute("data-action");
    if (a === "sit") {
      if (!me) { openEntry(); return; }
      var tid = b.getAttribute("data-table"), t = TBY[tid];
      if (me.want === tid) { setNote("もう" + t.name + "に座っています。"); return; }
      if (occupants(tid).length >= t.seats.length) { setNote(t.name + "は満席です。"); return; }
      setTable(tid); setNote(t.name + "へ移動しています。");
    } else if (a === "person") {
      var p = people[b.getAttribute("data-id")]; if (!p || p.isMe || !me || !p.table || me.table === p.table) return;
      if (occupants(p.table).length >= TBY[p.table].seats.length) { setNote(TBY[p.table].name + "は満席です。"); return; }
      setTable(p.table); setNote(p.name + "さんのいる" + TBY[p.table].name + "へ移動しています。");
    } else if (a === "leave") { if (me) { setTable(""); setNote("席を立ちました。会話からは外れています。"); } }
    else if (a === "mic") { state.mic = !state.mic; syncMedia(); renderControls(); }
    else if (a === "cam") { state.cam = !state.cam; syncMedia(); renderControls(); }
    else if (a === "audio") { if (room) room.startAudio().then(function () { document.getElementById("audio-btn").hidden = true; }, function () {}); }
    else if (a === "exit") {
      if (room) room.disconnect();
      room = null; me = null; people = {}; Object.keys(charEls).forEach(function (k) { charEls[k].remove(); }); charEls = {};
      document.getElementById("audio-sink").innerHTML = "";
      setNote("退室しました。"); renderUI(); openEntry();
    }
  });
  document.getElementById("chat-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var i = document.getElementById("chat-input"), v = i.value.trim().slice(0, 500);
    if (!v || !me || !me.table || !room) return;
    post(me.table, me, v); say(me, v.length > 14 ? v.slice(0, 14) + "…" : v); i.value = "";
    var dest = occupants(me.table).filter(function (p) { return !p.isMe; }).map(function (p) { return p.id; });
    if (dest.length) room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ t: me.table, text: v })), { reliable: true, topic: "chat", destinationIdentities: dest }).catch(function () { setNote("メッセージを送れませんでした。"); });
  });

  function tickClock() { var d = new Date(); document.getElementById("clock").textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hhmm(d); }
  tickClock(); setInterval(tickClock, 15000);
  setInterval(function () { renderPlates(); renderSummary(); renderRoster(); }, 3000);

  renderUI();
  requestAnimationFrame(frame);
  if (!LK) setNote("通話ライブラリを読み込めませんでした。ネット接続を確認して、ページを再読み込みしてください。");
  else openEntry();
})();
</script>
</body>
</html>
